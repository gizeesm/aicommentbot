<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Instagram Bağla - AICommentBot</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #14192b;
  padding: 24px;
}
.card {
  display: flex;
  width: 100%;
  max-width: 1080px;
  min-height: 620px;
  background: white;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 40px 90px rgba(0,0,0,0.5);
  animation: cardIn 0.55s ease;
}
@keyframes cardIn {
  from { opacity: 0; filter: blur(10px); transform: scale(0.96); }
  to { opacity: 1; filter: blur(0); transform: scale(1); }
}

.side-panel {
  flex: 0 0 46%;
  position: relative;
  overflow: hidden;
  background: #1F2A44;
  padding: 60px 56px;
  display: flex;
  flex-direction: column;
  color: white;
}
.gold-wedge {
  position: absolute;
  left: 0; bottom: 0;
  width: 100%; height: 42%;
  background: linear-gradient(100deg, #C6A75E, #E8DCC8 130%);
  clip-path: polygon(0 38%, 100% 0, 100% 100%, 0 100%);
  z-index: 0;
}
.circle {
  position: absolute;
  border-radius: 50%;
  background: rgba(255,255,255,0.06);
}
.circle.c1 { width: 240px; height: 240px; top: -60px; right: -60px; }
.circle.c2 { width: 150px; height: 150px; bottom: 32%; left: -50px; background: rgba(198,167,94,0.18); }

.brand {
  position: relative; z-index: 2;
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: 'Poppins', sans-serif;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.04em;
}
.brand .dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #C6A75E;
}

.headline {
  position: relative; z-index: 2;
  font-family: 'Poppins', sans-serif;
  font-weight: 800;
  font-size: 2.3rem;
  line-height: 1.22;
  margin: 44px 0 20px;
}
.headline span { color: #C6A75E; }
.subtext {
  position: relative; z-index: 2;
  font-size: 14.5px;
  color: rgba(255,255,255,0.72);
  line-height: 1.7;
  max-width: 320px;
  margin-bottom: 32px;
}
.steps {
  position: relative; z-index: 2;
  list-style: none;
  font-size: 13.5px;
  color: rgba(255,255,255,0.75);
  line-height: 2.1;
}
.steps li::before {
  content: "→ ";
  color: #C6A75E;
  font-weight: 700;
}

.form-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 56px;
}
.avatar {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  background: linear-gradient(135deg, #C6A75E, #1F2A44);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 18px;
  box-shadow: 0 14px 28px rgba(31,42,68,0.25);
}
.avatar svg { width: 32px; height: 32px; fill: white; }
h1 {
  font-family: 'Poppins', sans-serif;
  font-size: 1.4rem;
  color: #1F2A44;
  letter-spacing: 0.06em;
  margin-bottom: 32px;
  text-align: center;
}
form { width: 100%; max-width: 300px; }
.field {
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1.5px solid #ece5d8;
  padding: 12px 4px;
  margin-bottom: 26px;
}
.field svg { width: 18px; height: 18px; fill: #b3a98f; flex-shrink: 0; }
.field input {
  border: none;
  outline: none;
  font-size: 14.5px;
  font-family: 'Inter', sans-serif;
  width: 100%;
  background: transparent;
  color: #1F2A44;
}
button[type="submit"] {
  width: 100%;
  padding: 15px;
  margin-top: 10px;
  background: #1F2A44;
  color: #E8DCC8;
  border: none;
  border-radius: 999px;
  font-weight: 600;
  font-size: 14.5px;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
  box-shadow: 0 10px 22px rgba(31,42,68,0.25);
}
button[type="submit"]:hover {
  background: #C6A75E;
  color: #1F2A44;
  transform: translateY(-2px);
  box-shadow: 0 14px 28px rgba(198,167,94,0.4);
}
.error {
  color: #a13d3d;
  font-size: 13px;
  text-align: center;
  margin-top: 18px;
}
@media (max-width: 760px) {
  .card { flex-direction: column; }
  .side-panel { flex: 0 0 auto; }
}
</style>
</head>
<body>

<div class="card">
  <div class="side-panel">
    <div class="circle c1"></div>
    <div class="circle c2"></div>
    <div class="gold-wedge"></div>

    <div class="brand"><span class="dot"></span> AICommentBot</div>

    <div class="headline">Instagram<br><span>Hesabını Bağla</span></div>
    <div class="subtext">Yorumlarını görebilmemiz için hesabına ait erişim bilgilerini gir.</div>

    <ul class="steps">
      <li>Meta for Developers panelinden token oluştur</li>
      <li>Instagram kullanıcı adını gir</li>
      <li>Token'ı yapıştır ve bağla</li>
    </ul>
  </div>

  <div class="form-panel">
    <div class="avatar">
      <svg viewBox="0 0 24 24"><path d="M12 2.2c-2.7 0-3 .01-4.05.06-1.05.05-1.77.22-2.4.46a4.9 4.9 0 0 0-1.77 1.15A4.9 4.9 0 0 0 2.63 5.6c-.24.63-.4 1.35-.46 2.4C2.12 9.05 2.1 9.38 2.1 12s.01 2.95.06 4c.05 1.05.22 1.77.46 2.4a4.9 4.9 0 0 0 1.15 1.77 4.9 4.9 0 0 0 1.77 1.15c.63.24 1.35.4 2.4.46 1.05.05 1.38.06 4.05.06s3-.01 4.05-.06c1.05-.05 1.77-.22 2.4-.46a4.9 4.9 0 0 0 1.77-1.15 4.9 4.9 0 0 0 1.15-1.77c.24-.63.4-1.35.46-2.4.05-1.05.06-1.38.06-4s-.01-2.95-.06-4c-.05-1.05-.22-1.77-.46-2.4a4.9 4.9 0 0 0-1.15-1.77A4.9 4.9 0 0 0 18.6 2.72c-.63-.24-1.35-.4-2.4-.46C15.15 2.21 14.82 2.2 12 2.2zm0 2.16c2.65 0 2.96.01 4 .06.97.04 1.5.21 1.85.34.46.18.79.4 1.14.75.35.35.57.68.75 1.14.13.35.3.88.34 1.85.05 1.04.06 1.35.06 4s-.01 2.96-.06 4c-.04.97-.21 1.5-.34 1.85-.18.46-.4.79-.75 1.14-.35.35-.68.57-1.14.75-.35.13-.88.3-1.85.34-1.04.05-1.35.06-4 .06s-2.96-.01-4-.06c-.97-.04-1.5-.21-1.85-.34a3.06 3.06 0 0 1-1.14-.75 3.06 3.06 0 0 1-.75-1.14c-.13-.35-.3-.88-.34-1.85-.05-1.04-.06-1.35-.06-4s.01-2.96.06-4c.04-.97.21-1.5.34-1.85.18-.46.4-.79.75-1.14.35-.35.68-.57 1.14-.75.35-.13.88-.3 1.85-.34 1.04-.05 1.35-.06 4-.06z"/></svg>
    </div>
    <h1>INSTAGRAM HESABINI BAĞLA</h1>
    <form method="POST">
      <div class="field">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.5c-3.3 0-9.8 1.6-9.8 4.9v2.4h19.6v-2.4c0-3.3-6.5-4.9-9.8-4.9z"/></svg>
        <input type="text" name="instagram_username" placeholder="Instagram kullanıcı adı" required>
      </div>
      <div class="field">
        <svg viewBox="0 0 24 24"><path d="M17 8V7a5 5 0 0 0-10 0v1H5v13h14V8h-2zM9 7a3 3 0 0 1 6 0v1H9V7zm5 9.7V19h-4v-2.3a2 2 0 1 1 4 0z"/></svg>
        <input type="text" name="instagram_token" placeholder="Erişim token'ı" required>
      </div>
      <button type="submit">Bağla</button>
    </form>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
  </div>
</div>

</body>
</html>
