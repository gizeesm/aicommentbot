<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Giriş - AICommentBot</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #14192b;
  padding: 24px;
}
.card {
  display: flex;
  width: 100%;
  max-width: 1080px;
  min-height: 620px;
  background: white;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 40px 90px rgba(0,0,0,0.5);
  animation: cardIn 0.55s ease;
}
@keyframes cardIn {
  from { opacity: 0; filter: blur(10px); transform: scale(0.96); }
  to { opacity: 1; filter: blur(0); transform: scale(1); }
}

.side-panel {
  flex: 0 0 46%;
  position: relative;
  overflow: hidden;
  background: #1F2A44;
  padding: 60px 56px;
  display: flex;
  flex-direction: column;
  color: white;
}
.gold-wedge {
  position: absolute;
  left: 0; bottom: 0;
  width: 100%; height: 42%;
  background: linear-gradient(100deg, #C6A75E, #E8DCC8 130%);
  clip-path: polygon(0 38%, 100% 0, 100% 100%, 0 100%);
  z-index: 0;
}
.circle {
  position: absolute;
  border-radius: 50%;
  background: rgba(255,255,255,0.06);
}
.circle.c1 { width: 240px; height: 240px; top: -60px; right: -60px; }
.circle.c2 { width: 150px; height: 150px; bottom: 32%; left: -50px; background: rgba(198,167,94,0.18); }

.brand {
  position: relative; z-index: 2;
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: 'Poppins', sans-serif;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.04em;
}
.brand .dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #C6A75E;
}

.tab-row {
  position: relative; z-index: 2;
  display: flex;
  gap: 10px;
  margin: 48px 0 34px;
}
.tab {
  text-decoration: none;
  font-family: 'Poppins', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.1em;
  padding: 11px 24px;
  border-radius: 999px;
  transition: all 0.25s ease;
}
.tab.active {
  background: white;
  color: #1F2A44;
  box-shadow: 0 10px 24px rgba(0,0,0,0.25);
}
.tab:not(.active) {
  color: rgba(255,255,255,0.65);
  border: 1px solid rgba(255,255,255,0.25);
}
.tab:not(.active):hover { color: white; border-color: rgba(255,255,255,0.6); }

.headline {
  position: relative; z-index: 2;
  font-family: 'Poppins', sans-serif;
  font-weight: 800;
  font-size: 2.5rem;
  line-height: 1.22;
  margin-bottom: 20px;
}
.headline span { color: #C6A75E; }
.subtext {
  position: relative; z-index: 2;
  font-size: 14.5px;
  color: rgba(255,255,255,0.72);
  line-height: 1.7;
  max-width: 320px;
  margin-bottom: 60px;
}

.stats {
  position: relative; z-index: 2;
  display: flex;
  gap: 44px;
  margin-top: auto;
}
.stat b {
  display: block;
  font-family: 'Poppins', sans-serif;
  font-size: 1.5rem;
  font-weight: 800;
  color: #E8DCC8;
  margin-bottom: 4px;
}
.stat span {
  font-size: 11px;
  letter-spacing: 0.06em;
  color: rgba(255,255,255,0.6);
  text-transform: uppercase;
}

.form-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 56px;
}
.avatar {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  background: linear-gradient(135deg, #C6A75E, #1F2A44);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 18px;
  box-shadow: 0 14px 28px rgba(31,42,68,0.25);
}
.avatar svg { width: 32px; height: 32px; fill: white; }
h1 {
  font-family: 'Poppins', sans-serif;
  font-size: 1.5rem;
  color: #1F2A44;
  letter-spacing: 0.08em;
  margin-bottom: 38px;
}
form { width: 100%; max-width: 300px; }
.field {
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1.5px solid #ece5d8;
  padding: 12px 4px;
  margin-bottom: 32px;
  transition: border-color 0.25s ease;
}
.field:focus-within { border-bottom-color: #C6A75E; }
.field svg { width: 18px; height: 18px; fill: #b3a98f; flex-shrink: 0; }
.field input {
  border: none;
  outline: none;
  font-size: 14.5px;
  font-family: 'Inter', sans-serif;
  width: 100%;
  background: transparent;
  color: #1F2A44;
}
button[type="submit"] {
  width: 100%;
  padding: 15px;
  margin-top: 10px;
  background: #1F2A44;
  color: #E8DCC8;
  border: none;
  border-radius: 999px;
  font-weight: 600;
  font-size: 14.5px;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
  box-shadow: 0 10px 22px rgba(31,42,68,0.25);
}
button[type="submit"]:hover {
  background: #C6A75E;
  color: #1F2A44;
  transform: translateY(-2px);
  box-shadow: 0 14px 28px rgba(198,167,94,0.4);
}
.error {
  color: #a13d3d;
  font-size: 13px;
  text-align: center;
  margin-top: 18px;
}
@media (max-width: 760px) {
  .card { flex-direction: column; }
  .side-panel { flex: 0 0 auto; }
  .stats { display: none; }
}
</style>
</head>
<body>

<div class="card">
  <div class="side-panel">
    <div class="circle c1"></div>
    <div class="circle c2"></div>
    <div class="gold-wedge"></div>

    <div class="brand"><span class="dot"></span> AICommentBot</div>

    <div class="tab-row">
      <span class="tab active">GİRİŞ</span>
      <a class="tab" href="{{ url_for('register') }}">KAYIT OL</a>
    </div>

    <div class="headline">Yorumlarınızı<br><span>Otomatikleştirin</span></div>
    <div class="subtext">Instagram yorumlarınıza yapay zeka destekli, onayınızdan geçen akıllı yanıtlar üretin.</div>

    <div class="stats">
      <div class="stat"><b>7/24</b><span>Aktif</span></div>
      <div class="stat"><b>AI</b><span>Destekli</span></div>
      <div class="stat"><b>%100</b><span>Kontrolünüzde</span></div>
    </div>
  </div>

  <div class="form-panel">
    <div class="avatar">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.5c-3.3 0-9.8 1.6-9.8 4.9v2.4h19.6v-2.4c0-3.3-6.5-4.9-9.8-4.9z"/></svg>
    </div>
    <h1>HOŞ GELDİNİZ</h1>
    <form method="POST">
      <div class="field">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.5c-3.3 0-9.8 1.6-9.8 4.9v2.4h19.6v-2.4c0-3.3-6.5-4.9-9.8-4.9z"/></svg>
        <input type="text" name="username" placeholder="Kullanıcı adı" required>
      </div>
      <div class="field">
        <svg viewBox="0 0 24 24"><path d="M17 8V7a5 5 0 0 0-10 0v1H5v13h14V8h-2zM9 7a3 3 0 0 1 6 0v1H9V7zm5 9.7V19h-4v-2.3a2 2 0 1 1 4 0z"/></svg>
        <input type="password" name="password" placeholder="Şifre" required>
      </div>
      <button type="submit">Giriş Yap</button>
    </form>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
  </div>
</div>

</body>
</html>
